[project]
name = "defi-luecke"
version = "0.1.0"
description = "Versorgung der Bevölkerung mit öffentlich zugänglichen Defibrillatoren (AED) analysieren und neue Standorte vorschlagen."
requires-python = ">=3.11"
# Exact pins live in requirements.txt (reproducible install).
dependencies = [
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "scipy",
    "requests",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
