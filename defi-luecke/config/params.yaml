# Model parameters. Values marked "placeholder" are defaults from SPEC v0.1;
# the team fixes the final values based on the literature (SPEC section 13).

crs:
  compute: "EPSG:3035"   # ETRS89-LAEA, native CRS of the census grid
  web: "EPSG:4326"       # WGS84 for the web app

osm:
  # Tried in this order. All serve the same Overpass API on OSM data.
  overpass_urls:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
  # Fixed snapshot for all analyses (YYYY-MM-DD). Empty = newest snapshot in data/raw.
  snapshot_date: "2026-11-15"
  query_buffer_m: 2000   # bounding box buffer around the region
  timeout_s: 180
  aed_tags_to_keep:
    - access
    - opening_hours
    - indoor
    - "defibrillator:location"
    - level
    - operator
    - check_date
    - "survey:date"
    - description

census:
  zip_url: "https://www.destatis.de/static/DE/zensus/gitterdaten/Zensus2022_Bevoelkerungszahl.zip"
  csv_name: "Zensus2022_Bevoelkerungszahl_100m-Gitter.csv"
  # Value column: documented name first, actual header of the CSV second (see docs/schnittstellen.md)
  population_columns: ["Bevoelkerungszahl", "Einwohner"]
  attribution: "© Statistische Ämter des Bundes und der Länder, 2024, dl-de/by-2-0"

boundaries:
  zip_url: "https://daten.gdz.bkg.bund.de/produkte/vg/vg250-ew_ebenen_1231/aktuell/vg250-ew_12-31.utm32s.gpkg.ebenen.zip"
  gpkg_member: "vg250-ew_ebenen_1231/DE_VG250.gpkg"
  land_gf_value: 4   # vg250.pdf, section 3.2.3
  attribution: "© BKG (2026) dl-de/by-2-0"

coverage:
  detour_factor: 1.3                 # placeholder
  radii_m: [100, 200, 300, 500]      # placeholder
  walking_speed_m_per_s: 1.4         # placeholder, only for the time-to-radius helper
  scenarios:
    - all
    - night_strict
    - night_optimistic
  excluded_access_values: [private, "no"]

optimize:
  k_max_district: 20
  k_max_municipality: 3
  candidate_variants: [A, B]
  # Variant B: publicly accessible places from OSM (key -> list of values).
  candidate_osm_tags:
    amenity:
      - townhall
      - fire_station
      - community_centre
      - bank
      - pharmacy
      - place_of_worship
      - school
    leisure:
      - sports_hall
    shop:
      - supermarket
    highway:
      - bus_stop

validation:
  match_tolerance_m: 50
  confidence_level: 0.95
  # Surveyed sub-areas: area name -> list of municipality AGS codes (8 digits, as strings).
  # Survey file validation/surveys/<region>_<area>.csv belongs to <area>. Empty until the
  # team has surveyed an area, e.g.  musterort: ["07231001"]
  areas: {}

plausibility:
  max_population_deviation_pct: 3.0  # placeholder ("wenige Prozent")
  duplicate_distance_m: 5            # placeholder ("wenige Meter")
