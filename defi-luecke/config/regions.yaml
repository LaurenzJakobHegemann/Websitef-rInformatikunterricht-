# Pilot regions. Keys are used as --region on the command line.
regions:
  bernkastel-wittlich:
    name: "Landkreis Bernkastel-Wittlich"
    state: "Rheinland-Pfalz"
    # Kreisschlüssel (AGS). Verified 2026-11-15 in VG250-EW (Stand 31.12.2025):
    # AGS 07231 = "Bernkastel-Wittlich", BEZ "Landkreis". The pipeline re-checks it.
    district_key: "07231"
    district_key_verified: true
    # Official population for the plausibility check (SPEC section 10).
    # Read at runtime from the EWZ attribute of VG250-EW; the value here is the
    # documented reference and is compared against it.
    official_population: 112751
    official_population_source: "BKG VG250-EW, Attribut EWZ (Destatis, Stand 31.12.2025)"

  # Pilot region B: to be decided by the team (SPEC section 13).
  region-b:
    name: null
    state: null
    district_key: null
    district_key_verified: false
    official_population: null
    official_population_source: null
